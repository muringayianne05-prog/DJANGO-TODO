<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StyleNest{% endblock %}</title>

    <style>
        :root {
            --bg: #f6f6f8;
            --card: #ffffff;
            --text: #2f2f2f;
            --muted: #7a7a7a;

            --primary: #b76e79;
            --primary-dark: #9f5964;
            --accent: #d8a7b1;

            --border: #e9e9ee;
            --shadow: 0 10px 25px rgba(0,0,0,0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* NAVBAR */
        .navbar {
            background: var(--card);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 16px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--muted);
            font-size: 14px;
            transition: 0.25s;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: rgba(183, 110, 121, 0.08);
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 750px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 16px;
            padding: 35px;
            box-shadow: var(--shadow);
            border-top: 4px solid var(--accent);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 26px;
        }

        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.25s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #6f6f6f;
            color: white;
        }

        .btn-danger:hover {
            background: #555;
        }

        .btn-success {
            background: var(--accent);
            color: white;
        }

        .btn-success:hover {
            background: #c48a95;
        }

        /* INPUTS */
        .form-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fafafa;
            transition: 0.25s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(183, 110, 121, 0.15);
            background: white;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 45px;
            font-size: 12px;
            color: var(--muted);
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">STYLENEST</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Tasks</a>
            <a href="#">Create</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="container">
        <h1>{% block page_title %}Welcome{% endblock %}</h1>
        {% block content %}{% endblock %}
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 StyleNest • Where elegance meets everyday fashion
    </div>

</body>
</html>
