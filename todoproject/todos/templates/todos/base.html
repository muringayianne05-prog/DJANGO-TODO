<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StyleNest{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f6;
            color: #333;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 60px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            color: #d88c9a;
            letter-spacing: 2px;
        }

        .nav-links a {
            margin: 0 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #d88c9a;
        }

        .nav-btn {
            background: #d88c9a;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
        }

        .main-content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            border-top: 1px solid #eee;
            color: #777;
            font-size: 13px;
        }

        /* GLOBAL BUTTONS */
        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #d88c9a;
            color: white;
        }

        .btn-secondary {
            background: #ccc;
            color: white;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="navbar">
    <div class="logo">STYLENEST</div>

    <div class="nav-links">
        <a href="{% url 'todo_list' %}">HOME</a>
    </div>

    <a href="{% url 'todo_create' %}" class="nav-btn">ADD PIECE</a>
</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<div class="footer">
    <p><strong>STYLENEST</strong></p>
    <p>Where elegance meets everyday fashion</p>
</div>

</body>
</html>
